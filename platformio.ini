; PlatformIO project for the Overby Industries shuttle FSM firmware.
; Relocated under firmware/ (rather than PlatformIO's project-root default)
; so it sits next to the rest of the repo's content (docs/, sim/, cad/,
; diagrams/) instead of competing with it at the repo root.
; https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
src_dir = firmware/src
lib_dir = firmware/lib
test_dir = firmware/test

[env:uno]
platform = atmelavr
board = uno
framework = arduino

[env:native]
; Host-native build of the FSM logic tests (`pio test -e native`) -- no
; Arduino hardware required. `pio test` excludes src_dir's own main by
; default and links the test file against firmware/lib/shuttle_fsm instead.
; ARDUINO stays undefined here, so ShuttleFSM.cpp logs via stdio rather than
; Serial (see the OPP_LOG macro in ShuttleFSM.cpp).
platform = native
build_flags = -std=c++17
